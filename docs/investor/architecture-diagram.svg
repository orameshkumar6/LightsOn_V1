<svg viewBox="0 0 1400 1180" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1180" fill="#FFFFFF"/>
  <text x="60" y="52" font-size="26" font-weight="700" fill="#0F172A">Room Controller v4 — System Architecture</text>
  <text x="60" y="80" font-size="15" fill="#64748B">Client PWA → Firebase Realtime Database → ESP32 Firmware → Relay Hardware</text>

  <!-- Layer 1: Client devices -->
  <rect x="90" y="120" width="480" height="130" rx="14" fill="#EEF2FF" stroke="#4C63D2" stroke-width="1.5"/>
  <text x="120" y="160" font-size="19" font-weight="700" fill="#1E2A5E">Owner / Admin Device</text>
  <text x="120" y="185" font-size="14" fill="#334155">Phone · Tablet · Laptop</text>
  <text x="120" y="207" font-size="14" fill="#334155">PWA Dashboard — installable, works in any browser</text>
  <text x="120" y="229" font-size="14" fill="#334155">Rooms, schedules, GPIO config, multi-site profiles</text>

  <rect x="620" y="120" width="480" height="130" rx="14" fill="#EEF2FF" stroke="#4C63D2" stroke-width="1.5"/>
  <text x="650" y="160" font-size="19" font-weight="700" fill="#1E2A5E">Guest Device</text>
  <text x="650" y="185" font-size="14" fill="#334155">Any phone — no app install required</text>
  <text x="650" y="207" font-size="14" fill="#334155">Scans room QR code → Activation Page</text>
  <text x="650" y="229" font-size="14" fill="#334155">Enters access code to activate a booked slot</text>

  <!-- GitHub Pages hosting box -->
  <rect x="1140" y="130" width="180" height="110" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="1160" y="163" font-size="15" font-weight="700" fill="#334155">GitHub Pages</text>
  <text x="1160" y="184" font-size="12.5" fill="#475569">Static hosting</text>
  <text x="1160" y="202" font-size="12.5" fill="#475569">Serves HTML/CSS/JS</text>
  <text x="1160" y="220" font-size="12.5" fill="#475569">+ Service Worker</text>
  <path d="M1140,185 L1100,185" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow: clients -> Firebase -->
  <path d="M330,250 L330,300 L700,300 L700,340" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M860,250 L860,300 L700,300" stroke="#475569" stroke-width="2" fill="none"/>
  <rect x="580" y="272" width="330" height="26" fill="#FFFFFF"/>
  <text x="700" y="291" font-size="13.5" fill="#334155" text-anchor="middle">HTTPS REST writes  +  live sync via Server-Sent Events (SSE)</text>

  <!-- Layer 2: Firebase -->
  <rect x="380" y="345" width="640" height="150" rx="16" fill="#E9F5FF" stroke="#2F6FED" stroke-width="1.8"/>
  <text x="700" y="392" font-size="21" font-weight="700" fill="#123B8C" text-anchor="middle">Firebase Realtime Database</text>
  <text x="700" y="415" font-size="14" fill="#334155" text-anchor="middle">Google Cloud — fully managed, serverless, no infrastructure to run</text>
  <text x="700" y="440" font-size="13" fill="#475569" text-anchor="middle">/profiles/{n}/rooms   ·   /profiles/{n}/config   ·   /profiles/{n}/schedule</text>
  <text x="700" y="464" font-size="13" fill="#475569" text-anchor="middle">One database supports unlimited independent sites, each auto-numbered</text>

  <!-- Arrow: Firebase -> ESP32 -->
  <path d="M700,495 L700,560" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="530" y="505" width="340" height="46" fill="#FFFFFF"/>
  <text x="700" y="522" font-size="13.5" fill="#334155" text-anchor="middle">HTTPS REST — device polls every 5 seconds</text>
  <text x="700" y="541" font-size="13.5" fill="#334155" text-anchor="middle">over the site's WiFi → home/office router → internet</text>

  <!-- Layer 3: ESP32 firmware -->
  <rect x="400" y="565" width="600" height="150" rx="16" fill="#ECFDF5" stroke="#1D9A6C" stroke-width="1.8"/>
  <text x="700" y="612" font-size="21" font-weight="700" fill="#0F5C3E" text-anchor="middle">ESP32 Microcontroller — Firmware</text>
  <text x="700" y="635" font-size="14" fill="#334155" text-anchor="middle">WiFiManager captive-portal onboarding · LittleFS on-device config store</text>
  <text x="700" y="657" font-size="14" fill="#334155" text-anchor="middle">Per-room GPIO mapping · NC / NO relay-wiring logic · status LED</text>
  <text x="700" y="679" font-size="13" fill="#475569" text-anchor="middle">Cost: commodity WiFi SoC, ~US$5–8 per unit at volume</text>

  <!-- Arrow: ESP32 -> Relay -->
  <path d="M600,715 L600,790" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M900,715 L900,790" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="750" font-size="13" fill="#334155" text-anchor="middle">GPIO signal</text>
  <text x="900" y="750" font-size="13" fill="#334155" text-anchor="middle">GPIO signal</text>

  <!-- Layer 4: physical hardware -->
  <rect x="400" y="795" width="380" height="130" rx="14" fill="#FFF7ED" stroke="#C2760C" stroke-width="1.6"/>
  <text x="590" y="835" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">Relay Module</text>
  <text x="590" y="858" font-size="13.5" fill="#334155" text-anchor="middle">Isolates mains voltage from the board</text>
  <text x="590" y="878" font-size="13.5" fill="#334155" text-anchor="middle">Switches lights / fans / appliances ON-OFF</text>
  <text x="590" y="898" font-size="13.5" fill="#334155" text-anchor="middle">per-room configurable, NC or NO wiring</text>

  <rect x="820" y="795" width="380" height="130" rx="14" fill="#FFF7ED" stroke="#C2760C" stroke-width="1.6"/>
  <text x="1010" y="835" font-size="18" font-weight="700" fill="#8A4B08" text-anchor="middle">Status &amp; Room LEDs</text>
  <text x="1010" y="858" font-size="13.5" fill="#334155" text-anchor="middle">Optional per-room visual confirmation</text>
  <text x="1010" y="878" font-size="13.5" fill="#334155" text-anchor="middle">Dedicated system-status indicator</text>
  <text x="1010" y="898" font-size="13.5" fill="#334155" text-anchor="middle">independent of any single room's state</text>

  <!-- Legend -->
  <rect x="90" y="1000" width="1220" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="120" y="1035" font-size="15" font-weight="700" fill="#0F172A">Legend</text>
  <rect x="120" y="1050" width="22" height="22" rx="5" fill="#EEF2FF" stroke="#4C63D2"/>
  <text x="152" y="1066" font-size="13.5" fill="#334155">Client layer — any device, any owner or guest, zero app-store dependency</text>
  <rect x="120" y="1080" width="22" height="22" rx="5" fill="#E9F5FF" stroke="#2F6FED"/>
  <text x="152" y="1096" font-size="13.5" fill="#334155">Cloud layer — Google-managed backend, scales automatically, no servers to operate</text>
  <rect x="700" y="1050" width="22" height="22" rx="5" fill="#ECFDF5" stroke="#1D9A6C"/>
  <text x="732" y="1066" font-size="13.5" fill="#334155">Device layer — low-cost, WiFi-connected, self-configuring firmware</text>
  <rect x="700" y="1080" width="22" height="22" rx="5" fill="#FFF7ED" stroke="#C2760C"/>
  <text x="732" y="1096" font-size="13.5" fill="#334155">Physical layer — the actual switching hardware in the room</text>
</svg>
